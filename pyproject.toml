[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-review-scheduler-agent"
version = "0.1.0"
description = "A bounded ReAct agent for material review and publication draft scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
schedule-agent = "schedule_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
